<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Never shown inside another site's frame (clickjacking). -->
  <script>if(window.top!==window.self)document.documentElement.style.display='none'</script>
  <meta name="robots" content="noindex, nofollow, noarchive, noai, noimageai">
  <title>Loading… · Unified Service and Consulting</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fjojwlygbbajfqhdusut.supabase.co" crossorigin>
  <!-- The lesson's own stylesheets are fetched now, so they are ready when the page is written. -->
  <link rel="preload" href="ugl-site.css" as="style"><link rel="preload" href="ugl-page.css" as="style">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>try{if(localStorage.getItem('ugl-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
  <style>
    /* The loading screen: the site's ground and the live hue, before any stylesheet has arrived. */
    html,body{margin:0;height:100%;background:#050505;color:#dcdce0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    html[data-theme="light"],html[data-theme="light"] body{background:#f4f3f7;color:#34333a}
    .box{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
    .msg{font-size:14px;max-width:520px;line-height:1.6}
    .bar{width:min(320px,80vw);height:3px;background:rgba(128,128,128,.25);border-radius:2px;overflow:hidden}
    .bar i{display:block;height:100%;width:0;background:#00e5ff;transition:width .15s}
    html[data-theme="light"] .bar i{background:#00c2d8}
    a{color:#cdb0ff;font-size:14px}
    html[data-theme="light"] a{color:#3b0a6b}
  </style>
</head>
<body>
  <div class="box" id="box">
    <div class="msg" id="msg">Loading…</div>
    <div class="bar"><i id="fill"></i></div>
  </div>
  <script src="vendor/supabase.min.js"></script>
  <script src="ugl-config.js"></script>
  <script src="ugl-catalog.js"></script>
  <script src="ugl-auth.js"></script>
  <script src="ugl-theme.js"></script>
  <script src="ugl-guard.js"></script>
  <script src="ugl-assist.js"></script>
  <script>
  (function () {
    var cfg = window.UGL_CONFIG, db = window.uglDb, guard = window.uglGuard;
    var FN = window.uglFn('content'), CACHE = window.uglCacheName;
    var slug = new URLSearchParams(location.search).get('m');
    var item = window.UGL_CATALOG.items.filter(function (i) { return i.id === slug && !i.hidden && /\.(html|pdf)$/.test(i.path || ''); })[0];
    var file = item ? item.path : null;
    var SECTION = { course: 'Course', tools: 'Tools', simulator: 'Simulator' };
    var REFUSED = {
      'automated-browser': 'Automated browsers cannot open course material.',
      'ai-browser': 'AI browsers cannot open course material. Use Chrome, Edge, Safari or Firefox.',
      'bot-or-script': 'This browser cannot open course material.',
      'blocked-user': 'Your access is paused. Contact your trainer.',
      'no-access': 'This is not open to you. Ask your trainer if you need it.',
      'too-many-requests': 'Too many lessons opened in a short time. Try again in a few minutes.',
      'bulk-download': 'Too many lessons opened in a short time. Try again in a few minutes.',
      'auto-blocked': 'Your access has been blocked. This incident has been forwarded to the admin.',
      'staging-admins-only': 'This is the staging site, for admins only. Open the live site instead.',
      'not-found': 'Not found.'
    };
    // The refusals that are worth repeating when only the narration or the pictures failed.
    var REPEAT = /too many|paused/i;
    var token = null, name = 'trainee', sig = null, locked = false;
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    function fail(msg) {
      if (locked) return;
      document.getElementById('box').innerHTML =
        '<div class="msg">' + esc(msg) + '</div><a href="index.html">Back to course menu</a>';
    }

    // ---- Content gateway: checks, logs and hands out a 60-second link for one file.
    function gateway(body) {
      return fetch(FN, {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token, apikey: cfg.key, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (j) {
          if (res.ok && j.url) return j;
          var err = new Error(REFUSED[j.reason] || (res.status === 401 ? 'Please sign in again.' : res.status === 403 ? 'Access denied.' : 'Could not load.'));
          err.reason = j.reason;
          if (j.reason === 'auto-blocked') lockout(j.why);
          throw err;
        });
      });
    }
    // Page reports. While leaving a page only a beacon is reliable, and a beacon cannot carry
    // headers, so it sends the sign-in token in its (plain text) body instead. Otherwise the
    // gateway's answer comes back (print / save: the warning count, or a block).
    function report(kind, detail, leaving) {
      if (!token) return null;
      var body = { action: 'event', kind: kind, module: slug, detail: detail || null };
      try {
        if (leaving && navigator.sendBeacon) {
          body.token = token;
          if (navigator.sendBeacon(FN, new Blob([JSON.stringify(body)], { type: 'text/plain' }))) return null;
          delete body.token;
        }
        return fetch(FN, {
          method: 'POST', keepalive: !!leaving,
          headers: { Authorization: 'Bearer ' + token, apikey: cfg.key, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }).then(function (res) { return res.json(); }).catch(function () { return null; });
      } catch (e) { return null; }
    }

    // Blocked automatically (the gateway decided): the lesson goes, this device is signed out and
    // the person is told the incident went to the admin.
    function lockout(why) {
      if (locked) return;
      locked = true;
      try { if (window.caches) caches.delete(CACHE); } catch (e) {}
      db.auth.signOut({ scope: 'local' }).catch(function () {});
      document.querySelectorAll('audio, video').forEach(function (m) { try { m.pause(); } catch (e) {} });
      document.title = 'Access blocked · Unified Service and Consulting';
      document.body.innerHTML = '';
      var box = document.createElement('div');
      box.setAttribute('role', 'alert');
      box.setAttribute('style', 'position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;' +
        'text-align:center;background:#050505;color:#fff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif');
      box.innerHTML = '<div style="font-size:13px;color:#ff7a7a">Access blocked</div>' +
        '<h1 style="margin:0;max-width:560px;font:700 26px/1.25 system-ui,-apple-system,sans-serif">This incident has been forwarded to the admin.</h1>' +
        '<p style="margin:0;max-width:520px;color:#dcdce0">' + esc(why || 'A course security rule was broken.') + ' Your account stays blocked until the admin restores it.</p>' +
        '<a href="index.html?out=auto" style="color:#cdb0ff;font-size:15px">Back to sign-in</a>';
      document.body.appendChild(box);
    }

    function download(url, size, progress) {
      return fetch(url).then(function (res) {
        if (!res.ok) throw new Error('Could not load.');
        var total = size || +res.headers.get('content-length') || 0, got = 0, chunks = [];
        if (!res.body || !res.body.getReader) return res.blob();
        var reader = res.body.getReader();
        return (function pump() {
          return reader.read().then(function (r) {
            if (r.done) return new Blob(chunks);
            chunks.push(r.value); got += r.value.length;
            if (total && progress) progress(Math.min(1, got / total));
            return pump();
          });
        })();
      });
    }

    // A lesson is downloaded once and kept on this device (cleared at sign-out); it is fetched
    // again only when the file in storage changes. The gateway is still asked every time, so
    // every open is checked and logged.
    function openCache() {
      try { return window.caches ? caches.open(CACHE).catch(function () { return null; }) : Promise.resolve(null); } catch (e) { return Promise.resolve(null); }
    }
    // A copy kept on this device must not outlive the person's access to it.
    function forget(path) {
      openCache().then(function (c) {
        if (c) c.keys().then(function (ks) {
          ks.forEach(function (k) { if (k.url.indexOf('/__ugl-cache/' + encodeURIComponent(path) + '?') > 0) c.delete(k); });
        });
      }).catch(function () {});
    }
    function getFile(path, part, progress) {
      return gateway({ action: 'open', module: slug, path: path, part: part, signals: sig }).catch(function (err) {
        if (err.reason === 'no-access' || err.reason === 'blocked-user') forget(path);
        throw err;
      }).then(function (g) {
        var key = location.origin + '/__ugl-cache/' + encodeURIComponent(path) + '?v=' + encodeURIComponent(g.etag || '');
        return openCache().then(function (c) {
          return (c && g.etag ? c.match(key) : Promise.resolve(null)).then(function (hit) {
            if (hit) return hit.blob();
            return download(g.url, g.size, progress).then(function (blob) {
              if (c && g.etag) {
                c.keys().then(function (ks) {
                  ks.forEach(function (k) { if (k.url.indexOf('/__ugl-cache/' + encodeURIComponent(path) + '?') > 0 && k.url !== key) c.delete(k); });
                }).catch(function () {});
                c.put(key, new Response(blob)).catch(function () {});
              }
              return blob;
            });
          });
        });
      });
    }

    // ---- A pack (tools/pack.py) is one download holding many small files: a 4-byte little-endian
    // header length, a JSON header {key: [offset, length, mime?]}, then the blobs back to back.
    // Fills `into` with an object URL per key and resolves with it; `mime` is for entries whose
    // header carries none.
    // A page's pack lives next to the others under audio/ or media/ by file name (pages/road-3a.html -> media/road-3a.pack).
    function packPath(kind) { return kind + '/' + file.replace(/^.*\//, '').replace(/\.html$/, '.pack'); }
    function readPack(blob, into, mime) {
      return blob.slice(0, 4).arrayBuffer().then(function (b) {
        var n = new DataView(b).getUint32(0, true);
        return blob.slice(4, 4 + n).text().then(function (t) {
          var head = JSON.parse(t), base = 4 + n;
          Object.keys(head).forEach(function (k) {
            into[k] = URL.createObjectURL(blob.slice(base + head[k][0], base + head[k][0] + head[k][1], head[k][2] || mime));
          });
          return into;
        });
      });
    }

    // ---- Narration for decks built by tools/build_decks.py: the slides show first, the voice
    // pack follows (audio/<deck>.pack: an MP3 per clip id, into window.UGL_AUDIO).
    function loadNarration() {
      var path = packPath('audio');
      guard.toast('Loading narration…', 0);
      getFile(path, 'audio', function (p) { guard.toast('Loading narration… ' + Math.round(p * 100) + '%', 0); }).then(function (blob) {
        return readPack(blob, window.UGL_AUDIO || (window.UGL_AUDIO = {}), 'audio/mpeg');
      }).then(function () { guard.toast('Narration ready', 1600); }, function (e) {
        if (locked) return;
        guard.toast(REPEAT.test(e.message) ? e.message : 'Narration could not load. Refresh the page to try again.', 6000);
      });
    }

    // ---- Pictures for pages built by tools/road.py and tools/build_decks.py: the text shows first,
    // then media/<page>.pack arrives and every <img> whose src ends in "#k=<key>" gets its picture.
    // Decks read window.UGL_IMG for slides they draw later.
    var mediaEarly = null;  // the pack's download, started with the page for items the catalog marks media: true
    function loadMedia() {
      var path = packPath('media'), M = window.UGL_IMG || (window.UGL_IMG = {});
      function place() {
        document.querySelectorAll('img').forEach(function (img) {
          var src = img.getAttribute('src') || '', m = /#k=([\w-]+)$/.exec(src) || /%23k%3D([\w-]+)$/.exec(src);
          if (m && M[m[1]]) img.src = M[m[1]];
        });
      }
      (mediaEarly || getFile(path, 'media')).then(function (blob) {
        return readPack(blob, M, 'image/webp');
      }).then(function () {
        place();
        // Decks draw slides on demand: pictures that appear later get placed too.
        new MutationObserver(place).observe(document.body, { childList: true, subtree: true });
      }).catch(function (e) {
        if (locked) return;
        guard.toast(REPEAT.test(e.message) ? e.message : 'Pictures could not load. Refresh the page to try again.', 6000);
      });
    }

    function protect() {
      guard.install({ name: name, report: report, onBlocked: lockout }); readButton();
      window.uglStageBadge(document);
      // The course helper's button goes into the lesson's top bar (ugl-assist.js).
      window.uglAssist && window.uglAssist.mount(document);
      window.uglReport = report;  // road stops report finished drill sets through the same channel
      // Blocked or deleted while reading: leave the lesson for the login screen (ugl-auth.js).
      window.uglWatchSession(function (reason) { if (!locked) location.replace('index.html?out=' + reason); });
    }

    // Course lessons count toward progress only when the trainee marks them as read (lesson_done).
    function readButton() {
      if (item.section !== 'course') return;
      // The one floating pill on the site (DESIGN.md): the site tokens, a shadow because it floats, no blur.
      var css = document.createElement('style');
      css.textContent =
        '.ugl-read{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:2147483640;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;' +
        'border-radius:999px;border:1px solid var(--u-line-2);background:var(--u-surface-2);color:var(--u-text);font:600 13.5px/1 var(--u-font,system-ui,-apple-system,"Segoe UI",sans-serif);' +
        'cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:border-color .15s,transform .12s var(--ease-out,ease-out)}' +
        '.ugl-read::before{content:"";width:13px;height:13px;border-radius:50%;border:1.5px solid currentColor;box-sizing:border-box}' +
        '.ugl-read:hover{border-color:var(--u-text-3)}.ugl-read:active{transform:translateX(-50%) scale(.98)}.ugl-read:disabled{opacity:.6;cursor:wait}' +
        '.ugl-read.is-on{background:#1f3a2b;border-color:#3e7f5c;color:#bfe6cc}.ugl-read.is-on::before{content:"\\2713";border:0;width:auto;height:auto}' +
        '[data-theme="light"] .ugl-read.is-on{background:#e3efe6;color:#2f6b4a;border-color:#3e7f5c}' +
        '@media(prefers-reduced-motion:reduce){.ugl-read{transition:none}.ugl-read:active{transform:translateX(-50%)}}' +
        '.ugl-toast{bottom:72px!important}@media print{.ugl-read{display:none}}';
      document.head.appendChild(css);
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'ugl-read'; b.disabled = true; b.textContent = 'Mark as read';
      document.body.appendChild(b);
      var on = false, saving = false;
      function show() {
        b.classList.toggle('is-on', on);
        b.textContent = on ? 'Read · mark as unread' : 'Mark as read';
        b.setAttribute('aria-pressed', on);
      }
      db.from('lesson_done').select('module').eq('module', slug).then(function (r) {
        on = !!(r.data && r.data.length); show(); b.disabled = false;
      });
      // Write the mark (lesson_done) and flip the pill; `said` is the toast for the new state.
      function save(want, said) {
        if (saving) return;
        saving = true; b.disabled = true;
        var q = want ? db.from('lesson_done').insert({ module: slug }) : db.from('lesson_done').delete().eq('module', slug);
        q.then(function (r) {
          saving = false; b.disabled = false;
          if (r.error && r.error.code !== '23505') { guard.toast('Could not save that. Try again.'); return; }
          on = want; show();
          guard.toast(said || (on ? 'Marked as read' : 'Marked as unread'), said ? 3000 : 1600);
        });
      }
      b.addEventListener('click', function () {
        var want = !on, dr = window.UGL_DRILLS;
        // A road stop counts as read once its drills are done: that is where the learning is checked.
        if (want && dr && dr.done() < dr.n) {
          guard.toast('Finish the drills first: ' + dr.done() + ' of ' + dr.n + ' done. Then mark the stop as read.', 4000);
          var sec = document.getElementById('drills'); if (sec) sec.scrollIntoView({ behavior: 'smooth' });
          return;
        }
        save(want);
      });
      // A finished drill set marks the stop as read by itself (the drill engine calls this with its
      // result); the pill still works by hand, with the drills gate above.
      window.uglDrillsDone = function (r) {
        if (on || saving) return;
        save(true, 'Drills done: the stop is marked as read');
      };
    }

    // ---- HTML lessons (decks and built pages): replace this page with the lesson.
    function showHtml(html) {
      var deferredVoice = /window\.UGL_AUDIO \|\|/.test(html);
      document.open();
      document.write(html);
      document.close();
      var back = document.querySelector('.topbar .back');
      if (back) { back.href = 'index.html#' + item.section; back.textContent = '← ' + SECTION[item.section]; }
      var home = document.querySelector('a.homebtn');
      if (home) home.href = 'index.html#course';
      var sub = document.querySelector('.topbar__sub');
      if (sub && /ACADEMY|Academy|TRAINING COURSE|Training course/.test(sub.textContent)) sub.textContent = '/ Training course';
      protect();
      // Road pages carry "#k=<key>" placeholders; decks build theirs at run time from a URL-encoded stub ("%23k%3D").
      if (item.media || /#k=[\w-]+/.test(html) || /%23k%3D/.test(html)) loadMedia();
      if (deferredVoice) loadNarration();
      // Deep links like module.html?m=email-course#m6: jump to the section once the page has laid out.
      if (location.hash.length > 1) {
        var jump = function () { var t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); };
        if (document.readyState === 'complete') jump(); else window.addEventListener('load', jump, { once: true });
      }
      if (item.kind !== 'deck') { window.uglTheme.addButton(document); return; }
      // A deck's own scripts run only after its stylesheets load, so sync its switch once it has finished loading.
      var sync = function () { window.uglTheme.syncDeck(document); };
      if (document.readyState === 'complete') sync(); else window.addEventListener('load', sync, { once: true });
    }

    // ---- PDFs: render every page inside the site with pdf.js (vendor/pdfjs).
    function showPdf(bytes) {
      document.title = item.title + ' · Unified Service and Consulting';
      ['https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap', 'ugl-site.css', 'ugl-page.css']
        .forEach(function (href) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; document.head.appendChild(l); });
      document.head.querySelector('style').remove();
      document.body.className = 'ugl-unlocked';
      document.body.innerHTML =
        '<div class="app-shell"><header class="topbar"><div class="topbar__brand"><img class="topbar__mark" src="assets/unified-logo-icon.png" alt="Unified Service and Consulting">' +
        '<div><span class="topbar__title">DISPATCH</span><span class="topbar__sub">/ Training course</span></div></div>' +
        '<div class="topbar__right"><a class="back" href="index.html#' + item.section + '">← ' + SECTION[item.section] + '</a></div></header>' +
        '<main class="page page--wide"><section class="page-hero"><div class="eyebrow"><i></i><span id="pdf-k">Document</span></div><h1>' + esc(item.title) + '</h1>' +
        '<p class="lead">' + esc(item.desc) + '</p></section>' +
        '<div class="pdf-bar"><span id="pdf-pos">Loading pages…</span><div class="pdf-zoom"><button type="button" class="pdf-z" data-z="-1" aria-label="Zoom out">−</button>' +
        '<button type="button" class="pdf-z pdf-z--fit" data-z="0" aria-label="Fit to width"><span id="pdf-pct">100%</span></button>' +
        '<button type="button" class="pdf-z" data-z="1" aria-label="Zoom in">+</button></div></div>' +
        '<div class="pdf-pages" id="pdf-pages"></div></main></div>';
      window.uglTheme.addButton(document);
      protect();

      var pagesEl = document.getElementById('pdf-pages'), zoom = 1, pdf, figs = [];
      function width(fig) { return fig.clientWidth || pagesEl.clientWidth; }
      function render(fig) {
        var n = +fig.getAttribute('data-n'), w = width(fig);
        if (fig._w === w) return;
        fig._w = w;
        pdf.getPage(n).then(function (page) {
          var base = page.getViewport({ scale: 1 });
          var dpr = Math.min(window.devicePixelRatio || 1, 2);
          var vp = page.getViewport({ scale: w / base.width * dpr });
          var canvas = fig.querySelector('canvas');
          canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
          fig.style.aspectRatio = base.width + ' / ' + base.height;
          return page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        }).then(function () { fig.classList.add('is-ready'); }, function () {});
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) render(e.target); });
      }, { rootMargin: '800px 0px' });
      function setZoom(z) {
        zoom = Math.max(0.6, Math.min(2, z));
        pagesEl.parentNode.style.setProperty('--pdf-zoom', zoom);
        document.getElementById('pdf-pct').textContent = Math.round(zoom * 100) + '%';
        figs.forEach(function (f) { f._w = 0; io.unobserve(f); io.observe(f); });
      }
      document.querySelectorAll('.pdf-z').forEach(function (b) {
        b.addEventListener('click', function () { var d = +b.getAttribute('data-z'); setZoom(d ? zoom + d * 0.2 : 1); });
      });
      function where() {
        var mid = window.innerHeight / 2, cur = 1;
        figs.forEach(function (f) { if (f.getBoundingClientRect().top < mid) cur = +f.getAttribute('data-n'); });
        document.getElementById('pdf-pos').textContent = 'Page ' + cur + ' of ' + figs.length;
      }
      window.addEventListener('scroll', where, { passive: true });
      window.addEventListener('resize', function () { figs.forEach(function (f) { f._w = 0; io.unobserve(f); io.observe(f); }); });

      import('./vendor/pdfjs/pdf.min.mjs').then(function (pdfjs) {
        pdfjs.GlobalWorkerOptions.workerSrc = 'vendor/pdfjs/pdf.worker.min.mjs';
        return pdfjs.getDocument({ data: new Uint8Array(bytes), standardFontDataUrl: 'vendor/pdfjs/standard_fonts/', isEvalSupported: false }).promise;
      }).then(function (doc) {
        pdf = doc;
        document.getElementById('pdf-k').textContent = 'Document · ' + doc.numPages + (doc.numPages > 1 ? ' pages' : ' page');
        return doc.getPage(1).then(function (p1) {
          var v = p1.getViewport({ scale: 1 });
          for (var i = 1; i <= doc.numPages; i++) {
            var fig = document.createElement('figure');
            fig.className = 'pdf-page'; fig.setAttribute('data-n', i);
            fig.style.aspectRatio = v.width + ' / ' + v.height;
            fig.innerHTML = '<canvas aria-label="Page ' + i + ' of ' + doc.numPages + '"></canvas>';
            pagesEl.appendChild(fig); figs.push(fig); io.observe(fig);
          }
          where();
        });
      }).catch(function () {
        pagesEl.innerHTML = '<p class="note">This document could not be displayed. Refresh the page to try again.</p>';
      });
    }

    if (!file) { fail('This lesson is not available.'); return; }

    db.auth.onAuthStateChange(function (e, s) { if (s) token = s.access_token; });
    db.auth.getSession().then(function (r) {
      var session = r.data && r.data.session;
      if (!session) { location.replace('index.html'); return; }
      token = session.access_token;
      var email = session.user && session.user.email || '', dom = '@' + cfg.userDomain;
      name = email.slice(-dom.length) === dom ? email.slice(0, -dom.length) : email;
      sig = guard.signals();
      var fill = document.getElementById('fill');
      if (item.media) { mediaEarly = getFile(packPath('media'), 'media'); mediaEarly.catch(function () {}); }
      return getFile(file, 'main', function (p) { fill.style.width = p * 100 + '%'; }).then(function (blob) {
        if (/\.pdf$/.test(file)) return blob.arrayBuffer().then(showPdf);
        return blob.text().then(showHtml);
      });
    }).catch(function (err) { fail(err.message || 'Could not load.'); });
  })();
  </script>
</body>
